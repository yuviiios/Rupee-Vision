[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rupeevision"
version = "1.0.0"
description = "LSTM-based forecasting service for INR exchange rates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "flask==3.1.2",
    "flask-cors==6.0.5",
    "Flask-Limiter==4.1.1",
    "gunicorn==23.0.0; sys_platform != 'win32'",
    "waitress==3.0.2; sys_platform == 'win32'",
    "joblib==1.5.2",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.12.0",
    "requests==2.32.3",
    "urllib3==2.2.2",
    "scikit-learn==1.7.2",
    "structlog==26.1.0",
    "streamlit==1.67.0",
    "tensorflow-cpu==2.21.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pandas-stubs==2.3.3.250926",
    "pip-audit==2.9.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.4",
    "types-requests==2.32.4.20250913",
]
train = [
    "matplotlib==3.10.6",
    "statsmodels==0.14.5",
]

[project.scripts]
rupeevision-serve = "rupeevision.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "train"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PD",     # pandas-vet
    "NPY",    # numpy-specific rules
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
    "D",      # pydocstyle
    "EM",     # flake8-errmsg
    "TRY",    # tryceratops
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow typing.Any where a boundary is genuinely dynamic
    "TRY003", # message-in-raise is fine for a project of this size
    "PD901",  # `df` is idiomatic in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts are the point of a test
    "ANN201", # test functions need no return annotation
    "D103",   # docstrings optional on trivial test helpers
    "ARG001", # fixtures are often injected but unused by name
    "PLR2004",
]
"train/**" = ["T201"]  # print() is the intended UX for a CLI trainer

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
mypy_path = "src"
packages = ["rupeevision"]

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "flask_cors.*",
    "flask_limiter.*",
    "joblib.*",
    "keras.*",
    "matplotlib.*",
    "sklearn.*",
    "statsmodels.*",
    "tensorflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: tests that load real TensorFlow artifacts",
]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::UserWarning:google.protobuf.*",
]

[tool.coverage.run]
source = ["rupeevision"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
